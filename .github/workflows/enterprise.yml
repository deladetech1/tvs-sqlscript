# Schema for the enterprise databases -- customers hosting it themselves.
#
# Their database is in THEIR cloud account, which is why they cannot be
# discovered the way silos are: a silo's route row sits in our control plane, an
# enterprise's database is somewhere we reach only because they gave us a
# federated identity and a Key Vault. So the roster is a dropdown here, and
# onboarding one is an edit to this file plus two org variables.
#
# Never automatic. A merge is not consent to touch someone else's database.

name: enterprise

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which enterprise (add new ones to this list as they are onboarded)"
        type: choice
        required: true
        default: bgclt
        options:
          - bgclt
      environment:
        description: "Which of their environments"
        type: choice
        required: true
        default: prod
        options: [prod, dev]
      module:
        type: choice
        required: true
        default: all
        options: [all, core_platform, loandrift, mystoreguard, zeloshr, attendance]
      command:
        type: choice
        required: true
        default: validate
        options: [validate, verify, deploy]

concurrency:
  group: enterprise-${{ inputs.target }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.who.outputs.client_id }}
      subscription: ${{ steps.who.outputs.subscription }}
      secret_uri: ${{ steps.who.outputs.secret_uri }}
    steps:
      - name: Which identity and vault
        id: who
        run: |
          set -euo pipefail
          # One case per enterprise. Deliberately a visible edit: reaching into
          # someone else's cloud account should never be something a workflow
          # discovers for itself.
          case "${{ inputs.target }}" in
            bgclt)
              CLIENT="${{ vars.BGCLT_AZURE_CLIENT_ID }}"
              SUB="${{ vars.BGCLT_SUBSCRIPTION_ID }}"
              ;;
            *) echo "::error::no identity mapping for '${{ inputs.target }}'"; exit 1 ;;
          esac
          [ -n "$CLIENT" ] && [ -n "$SUB" ] || {
            echo "::error::${{ inputs.target }}: its client-id / subscription org variables are not set"; exit 1; }
          KV="${{ inputs.target }}-${{ inputs.environment }}-kv"
          echo "client_id=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "subscription=$SUB" >> "$GITHUB_OUTPUT"
          echo "secret_uri=https://$KV.vault.azure.net/secrets/migrator-db-url" >> "$GITHUB_OUTPUT"

  apply:
    needs: resolve
    uses: ./.github/workflows/apply.yml
    with:
      label: ${{ inputs.target }} (${{ inputs.environment }})
      module: ${{ inputs.module }}
      command: ${{ inputs.command }}
      target_class: enterprise
      enterprise_slug: ${{ inputs.target }}
      source: keyvault
      secret_uri: ${{ needs.resolve.outputs.secret_uri }}
      subscription_id: ${{ needs.resolve.outputs.subscription }}
      azure_client_id: ${{ needs.resolve.outputs.client_id }}
      azure_tenant_id: ${{ vars.TVS_TENANT_ID }}
