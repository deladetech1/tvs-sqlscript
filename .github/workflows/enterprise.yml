# Schema for the enterprise databases -- customers hosting it themselves.
#
# Their database is in THEIR cloud account, which is why they cannot be
# discovered the way silos are: a silo's route row sits in our control plane, an
# enterprise's database is somewhere we reach only because they gave us a
# federated identity and a Key Vault. So the roster is a dropdown here, and
# onboarding one is an edit to this file plus two org variables.
#
# Never automatic. A merge is not consent to touch someone else's database.

name: enterprise

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which enterprise (add new ones to this list as they are onboarded)"
        type: choice
        required: true
        default: bgclt
        options:
          - bgclt
      environment:
        description: "Which of their environments"
        type: choice
        required: true
        default: prod
        options: [prod, dev]
      module:
        type: choice
        required: true
        default: all
        options: [all, core_platform, loandrift, mystoreguard, zeloshr, attendance, accounting]
      command:
        type: choice
        required: true
        default: validate
        options: [validate, verify, status, deploy, migrations-list, rollback]
      credential:
        description: "Where the connection string comes from"
        type: choice
        required: true
        default: keyvault
        options: [keyvault, secret]
      destructive_ack:
        description: 'For rollback only: type exactly YESDestructive'
        type: string
        default: ""

concurrency:
  group: enterprise-${{ inputs.target }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.who.outputs.client_id }}
      tenant_id: ${{ steps.who.outputs.tenant_id }}
      subscription: ${{ steps.who.outputs.subscription }}
      secret_uri: ${{ steps.who.outputs.secret_uri }}
    steps:
      - name: Which identity and vault
        id: who
        run: |
          set -euo pipefail
          # One case per enterprise. Deliberately a visible edit: reaching into
          # someone else's cloud account should never be something a workflow
          # discovers for itself.
          case "${{ inputs.target }}" in
            bgclt)
              CLIENT="${{ vars.BGCLT_AZURE_CLIENT_ID }}"
              SUB="${{ vars.BGCLT_SUBSCRIPTION_ID }}"
              # THEIR directory, not ours. An enterprise hosts itself, which
              # means its subscription sits in its OWN Entra tenant and the
              # identity we sign in as is registered there. Signing in to the
              # platform tenant with their client id fails with AADSTS700016
              # ("application not found in the directory") — which reads like a
              # missing app registration rather than the wrong directory.
              TENANT="${{ vars.BGCLT_TENANT_ID }}"
              ;;
            *) echo "::error::no identity mapping for '${{ inputs.target }}'"; exit 1 ;;
          esac
          # Only needed to READ THE VAULT. With credential=secret nothing here
          # is used and no Azure login happens at all -- see the note below.
          if [ "${{ inputs.credential }}" = "keyvault" ]; then
            [ -n "$CLIENT" ] && [ -n "$SUB" ] && [ -n "$TENANT" ] || {
              echo "::error::${{ inputs.target }}: its client-id / tenant-id / subscription org variables are not set"; exit 1; }
          fi
          KV="${{ inputs.target }}-${{ inputs.environment }}-kv"
          echo "client_id=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT" >> "$GITHUB_OUTPUT"
          echo "subscription=$SUB" >> "$GITHUB_OUTPUT"
          echo "secret_uri=https://$KV.vault.azure.net/secrets/migrator-db-url" >> "$GITHUB_OUTPUT"

  apply:
    needs: resolve
    uses: ./.github/workflows/apply.yml
    with:
      label: ${{ inputs.target }} (${{ inputs.environment }})
      module: ${{ inputs.module }}
      command: ${{ inputs.command }}
      destructive_ack: ${{ inputs.destructive_ack }}
      target_env: ${{ inputs.environment }}
      target_class: enterprise
      enterprise_slug: ${{ inputs.target }}
      # AZURE IS ONLY HOW THE CONNECTION STRING IS FETCHED.
      #
      # The migration itself needs a Postgres URL and nothing else. `keyvault`
      # signs in with OIDC purely to read migrator-db-url out of the customer's
      # vault; `secret` takes the same string straight from a GitHub secret and
      # skips the login entirely (apply.yml guards that step on source).
      #
      # keyvault is the default because it is the better arrangement for
      # somebody else's database: the credential stays in THEIR vault, is
      # rotated in one place, and we never hold a copy. `secret` exists for
      # when that path is unavailable -- an enterprise whose directory we
      # cannot add a federated credential to should not block their schema.
      source: ${{ inputs.credential }}
      secret_uri: ${{ inputs.credential == 'keyvault' && needs.resolve.outputs.secret_uri || '' }}
      subscription_id: ${{ needs.resolve.outputs.subscription }}
      azure_client_id: ${{ needs.resolve.outputs.client_id }}
      azure_tenant_id: ${{ needs.resolve.outputs.tenant_id }}
    secrets:
      # One line per enterprise, like the identity mapping above: reaching for
      # a secret by a name built from an input would silently pass an empty
      # string for a target nobody had set one up for.
      database_url: ${{ inputs.target == 'bgclt' && secrets.BGCLT_DATABASE_URL || '' }}
