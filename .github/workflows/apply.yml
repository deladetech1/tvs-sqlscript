# Apply the schema to ONE database. Every other workflow here calls this.
#
# It exists because saas, silos, enterprise and the app pipelines were each
# carrying their own copy of the same five things -- checkout, setup-dotnet,
# dotnet build, the DATABASE_URL parser, and the module-name-to-number mapping --
# about nine hundred lines between them. The parser in particular is fiddly
# string surgery on a libpq URL, and four copies of fiddly string surgery is four
# places for a leading-zero port or a password containing '@' to behave
# differently.
#
# The caller's whole job is now to decide WHICH database. This decides nothing
# and knows nothing about tiers.
#
# Where the connection string comes from, because the two differ for a reason:
#
#   source: secret     the caller passes database_url, out of a GitHub
#                      Environment. That is how the SaaS pool and the app
#                      pipelines work, and it needs no Azure login.
#
#   source: keyvault   the caller passes secret_uri and this logs in with OIDC
#                      and reads it. That is how silos and enterprises work,
#                      because each tenant's credential lives in its own Key
#                      Vault secret and there are as many as there are tenants.
#
# WHICH SQL is decided here too, from the target, never by the caller: a
# production database gets exactly `master`, a dev one gets `dev` (or, for a push
# inside this repository, the branch that was pushed). Until 20261020 a
# cross-repo caller always got `dev`, so the Accounting and ZelosHR deploys on
# `main` applied tvs-sqlscript's DEV branch to saas-prod and skipped the
# rehearse-then-promote-to-master step. `target_env` is required and checked
# against the vault and the GitHub Environment, so a caller that says "dev" about
# a prod database fails instead of applying unpromoted SQL to it.
#
# The credential is read INSIDE this workflow either way. It is never a job
# output or a matrix value, because those are visible to anything that can read
# the run.

name: apply (one database)

on:
  workflow_call:
    inputs:
      label:
        description: "What to call this target in logs and the summary"
        type: string
        required: true
      module:
        description: "all | core_platform | loandrift | mystoreguard | zeloshr | attendance | accounting"
        type: string
        required: false
        default: all
      command:
        description: "deploy | validate | verify | status | rollback | migrations-list | plan (plan touches no database: it only shows which SQL would be applied)"
        type: string
        required: false
        default: validate
      target_env:
        description: "dev | prod -- the environment of the DATABASE. prod applies tvs-sqlscript master, dev applies dev."
        type: string
        required: true
      target_class:
        description: "saas | silo | enterprise — selects migrations/<class>/"
        type: string
        required: false
        default: ""
      silo_host:
        description: "Applies migrations/silo/<host>/ as well"
        type: string
        required: false
        default: ""
      destructive_ack:
        description: "For rollback only: must be exactly YESDestructive"
        type: string
        required: false
        default: ""
      enterprise_slug:
        description: "Applies migrations/enterprise/<slug>/ as well"
        type: string
        required: false
        default: ""
      source:
        description: "secret | keyvault"
        type: string
        required: false
        default: secret
      secret_uri:
        description: "Key Vault secret URI, when source=keyvault"
        type: string
        required: false
        default: ""
      subscription_id:
        description: "Azure subscription to log in to, when source=keyvault"
        type: string
        required: false
        default: ""
      azure_client_id:
        description: "OIDC client id, when source=keyvault"
        type: string
        required: false
        default: ""
      azure_tenant_id:
        description: "Azure AD tenant, when source=keyvault"
        type: string
        required: false
        default: ""
      environment:
        description: "GitHub Environment to bind to, when source=secret"
        type: string
        required: false
        default: ""
      refuse_pooled_database:
        description: "Fail if the resolved database is the pool. Set for silos."
        type: boolean
        required: false
        default: false
    secrets:
      database_url:
        description: "The connection string, when source=secret"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: ${{ inputs.command }} → ${{ inputs.label }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TVS_SSL: Require
      TVS_TARGET_CLASS: ${{ inputs.target_class }}
      TVS_SILO: ${{ inputs.silo_host }}
      TVS_ENTERPRISE: ${{ inputs.enterprise_slug }}

    steps:
      # Production gets master. Nothing a caller passes can change that: the ref
      # follows target_env, and target_env is cross-checked against the two
      # things that actually name the database -- the GitHub Environment (whose
      # DATABASE_URL is used) and the Key Vault (whose secret is used).
      - name: Which SQL
        id: sql
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          GH_ENVIRONMENT: ${{ inputs.environment }}
          SECRET_URI: ${{ inputs.secret_uri }}
          IN_REPO: ${{ github.repository == 'deladetech1/tvs-sqlscript' }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev|prod) ;;
            *) echo "::error::target_env must be dev or prod, got '$TARGET_ENV'"; exit 1 ;;
          esac

          looks_prod=""
          [[ "$GH_ENVIRONMENT" == *prod* ]] && looks_prod="GitHub Environment '$GH_ENVIRONMENT'"
          [[ "$SECRET_URI" =~ ^https://[^.]*-prod-kv\. ]] && looks_prod="vault in '$SECRET_URI'"
          if [ -n "$looks_prod" ] && [ "$TARGET_ENV" != prod ]; then
            echo "::error::target_env=$TARGET_ENV but the $looks_prod is production. Refusing: production only ever gets master."
            exit 1
          fi

          if [ "$TARGET_ENV" = prod ]; then
            REF=master
            # The SQL is master regardless. The workflow DEFINITION running this
            # is whatever the dispatch chose, so say so when it is not master.
            if [ "$IN_REPO" = true ] && [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "::warning::Production run dispatched from $GITHUB_REF. The SQL is still master; dispatch from master to run master's workflow too."
            fi
          elif [ "$IN_REPO" = true ]; then
            # A push to dev/saas/silo deploys THAT branch's SQL to dev targets.
            REF="$GITHUB_SHA"
          else
            REF=dev
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=SQL ref::target_env=$TARGET_ENV -> tvs-sqlscript@$REF"

      # Always names the repository: a bare checkout in a reusable workflow
      # takes the CALLER's repository, which for an app pipeline has no
      # Trovesuite.Database.sln ("MSB1009: Project file does not exist").
      - uses: actions/checkout@v4
        with:
          repository: deladetech1/tvs-sqlscript
          ref: ${{ steps.sql.outputs.ref }}

      - name: Record the SQL commit
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "::notice title=SQL commit::tvs-sqlscript@${{ steps.sql.outputs.ref }} = $SHA ($(git log -1 --format=%s))"
          {
            echo "### SQL · ${{ inputs.label }}"
            echo ""
            echo "target_env \`${{ inputs.target_env }}\` → tvs-sqlscript \`${{ steps.sql.outputs.ref }}\` at \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v4
        if: inputs.command != 'plan'
        with:
          dotnet-version: "10.0.x"

      - run: dotnet build Trovesuite.Database.sln -c Release --nologo
        if: inputs.command != 'plan'

      - name: Azure login
        if: inputs.source == 'keyvault' && inputs.command != 'plan'
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Resolve the connection string
        id: db
        if: inputs.command != 'plan'
        env:
          FROM_SECRET: ${{ secrets.database_url }}
          SECRET_URI: ${{ inputs.secret_uri }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.source }}" = "keyvault" ]; then
            [ -n "$SECRET_URI" ] || { echo "::error::source=keyvault but no secret_uri"; exit 1; }
            # https://<vault>.vault.azure.net/secrets/<name>[/<version>]
            vault="$(printf '%s' "$SECRET_URI" | sed -E 's#^https://([^.]+)\..*#\1#')"
            name="$(printf '%s' "$SECRET_URI" | sed -E 's#^https://[^/]+/secrets/([^/]+).*#\1#')"
            [ -n "$vault" ] && [ -n "$name" ] || { echo "::error::cannot parse '$SECRET_URI'"; exit 1; }
            DATABASE_URL="$(az keyvault secret show --vault-name "$vault" --name "$name" --query value -o tsv)"
            [ -n "$DATABASE_URL" ] || { echo "::error::$name is empty in $vault"; exit 1; }
          else
            DATABASE_URL="$FROM_SECRET"
            [ -n "$DATABASE_URL" ] || { echo "::error::source=secret but database_url was not passed"; exit 1; }
          fi
          echo "::add-mask::$DATABASE_URL"

          # libpq URL -> fields. postgresql://user:password@host:port/dbname?sslmode=…
          proto="${DATABASE_URL#postgresql://}"; proto="${proto#postgres://}"
          creds="${proto%%@*}"; rest="${proto#*@}"
          DB_USER="${creds%%:*}"; PGPASSWORD="${creds#*:}"
          hostport="${rest%%/*}"; DB_HOST="${hostport%%:*}"; DB_PORT="${hostport#*:}"
          # No ':' in the host part means no port was given.
          [[ "$DB_PORT" == "$hostport" ]] && DB_PORT=5432
          dbpart="${rest#*/}"; DB_NAME="${dbpart%%\?*}"

          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$DB_USER"

          # A silo whose secret resolves to the pool would apply silo-only SQL to
          # every tenant's data. Checked here, where the name is already parsed,
          # rather than trusted in each caller.
          # The last word on "is this production": the database's own name.
          if [ "$DB_NAME" = prod-db ] && [ "${{ inputs.target_env }}" != prod ]; then
            echo "::error::${{ inputs.label }} resolved to prod-db but target_env=${{ inputs.target_env }}. Refusing."
            exit 1
          fi

          if [ "${{ inputs.refuse_pooled_database }}" = "true" ]; then
            case "$DB_NAME" in
              dev-db|prod-db|staging-db)
                echo "::error::${{ inputs.label }} should have its own database but its secret points at the POOLED '$DB_NAME'. Refusing."
                exit 1 ;;
            esac
          fi

          {
            echo "DB_HOST=$DB_HOST"; echo "DB_PORT=$DB_PORT"; echo "DB_USER=$DB_USER"
            echo "PGPASSWORD=$PGPASSWORD"; echo "DB_NAME=$DB_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: ${{ inputs.command }}
        if: inputs.command != 'migrations-list' && inputs.command != 'plan'
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          DB_USER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
        run: |
          set -euo pipefail
          case "${{ inputs.command }}" in
            deploy|validate|verify|status) ;;
            rollback)
              # DROP SCHEMA ... CASCADE. The typed acknowledgement is the only
              # thing standing between a dropdown and a dropped schema.
              [ "${{ inputs.destructive_ack }}" = "YESDestructive" ] \
                || { echo "::error::rollback requires destructive_ack=YESDestructive"; exit 1; } ;;
            *) echo "::error::command '${{ inputs.command }}' not allowed (deploy|validate|verify|status|rollback)"; exit 1 ;;
          esac
          case "${{ inputs.module }}" in
            core_platform)          PICK=1 ;;
            loandrift)              PICK=2 ;;
            mystoreguard)           PICK=3 ;;
            zeloshr|human_resource) PICK=4 ;;   # human_resource kept as an alias
            attendance)             PICK=5 ;;
            accounting)             PICK=6 ;;
            all)                    PICK=0 ;;
            *) echo "::error::unknown module '${{ inputs.module }}'"; exit 1 ;;
          esac

          {
            echo "### ${{ inputs.command }} · ${{ inputs.label }}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| database | \`$DB_NAME\` |"
            echo "| module | \`${{ inputs.module }}\` |"
            echo "| class | \`${{ inputs.target_class || 'shared only' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Runner output (module pick $PICK; 0=ALL)"
          printf '%s\n' "$PICK" \
            | dotnet run --no-build -c Release \
                --project src/Trovesuite.Database.Runner -- \
                "$DB_HOST" "$DB_PORT" "$DB_USER" "$PGPASSWORD" "$DB_NAME" "${{ inputs.command }}"
          echo "::endgroup::"
          echo "::notice title=${{ inputs.command }} succeeded::${{ inputs.label }} — module=${{ inputs.module }}"

      # READ-ONLY. Which roles of OTHER databases on this server hold a privilege
      # in, or can CONNECT to, this one (silo-cross-tenant-pattern-grants, found
      # 2026-10-22). Runs after every command, success or failure, and never fails
      # the job: it is evidence, and the invariant itself lives in migration
      # 20261023-01. Look for the "ISOLATION <db>:" line.
      - name: Isolation report
        if: always() && steps.db.outputs.DB_NAME != ''
        env:
          PGHOST: ${{ steps.db.outputs.DB_HOST }}
          PGPORT: ${{ steps.db.outputs.DB_PORT }}
          PGUSER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          PGDATABASE: ${{ steps.db.outputs.DB_NAME }}
          PGSSLMODE: require
        run: |
          set -uo pipefail
          [ -f scripts/isolation_report.sql ] || { echo "no scripts/isolation_report.sql at this ref"; exit 0; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          psql --no-psqlrc -f scripts/isolation_report.sql 2>&1 | tee isolation.txt || true
          {
            echo "### isolation · ${{ inputs.label }}"
            echo ""
            echo '```'
            grep -E '^ ?ISOLATION ' isolation.txt | head -1 || echo "(no summary line -- see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Restore dotnet-ef tool
        if: startsWith(inputs.command, 'migrations-')
        # The repo pins dotnet-ef as a LOCAL tool (dotnet-tools.json), so `dotnet ef`
        # resolves to the manifest and ignores any --global install. Restore from the
        # manifest so the pinned version is available.
        run: dotnet tool restore

      - name: migrations-list
        if: inputs.command == 'migrations-list'
        env:
          # Pass the parsed DB connection through so `dotnet ef migrations list`
          # can mark each migration as Applied/Pending against this environment's
          # actual DB (instead of the design-time placeholder).
          TVS_DESIGN_CONNECTION: >-
            Host=${{ steps.db.outputs.DB_HOST }};Port=${{ steps.db.outputs.DB_PORT }};Username=${{ steps.db.outputs.DB_USER }};Password=${{ steps.db.outputs.PGPASSWORD }};Database=${{ steps.db.outputs.DB_NAME }};SSL Mode=Require;Trust Server Certificate=true
        run: |
          set -euo pipefail

          # Modules to query.
          if [[ "${{ inputs.module }}" == "all" ]]; then
            MODULES="CorePlatform LoanDrift MyStoreGuard HumanResource Attendance Accounting"
          else
            case "${{ inputs.module }}" in
              core_platform)  MODULES="CorePlatform" ;;
              loandrift)      MODULES="LoanDrift" ;;
              mystoreguard)   MODULES="MyStoreGuard" ;;
              zeloshr)        MODULES="HumanResource" ;;
              attendance)     MODULES="Attendance" ;;
              accounting)     MODULES="Accounting" ;;
              *) echo "::error::unknown module '${{ inputs.module }}'"; exit 1 ;;
            esac
          fi

          ENV_LABEL="${{ inputs.label }}"

          # Render the same Markdown table into:
          #   - console (so the step log is readable),
          #   - $GITHUB_STEP_SUMMARY (so it shows nicely on the run's Summary tab).
          {
            echo "## 🗃️  Migration status — \`$ENV_LABEL\`"
            echo ""
            echo "| Module | Migration | State |"
            echo "| --- | --- | --- |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Map our module name → its Postgres schema (where __EFMigrationsHistory lives).
          declare -A SCHEMA=(
            [CorePlatform]=core_platform
            [LoanDrift]=loandrift
            [MyStoreGuard]=mystoreguard
            [HumanResource]=zeloshr
            [Attendance]=attendance
            [Accounting]=accounting
          )

          DB_HOST="${{ steps.db.outputs.DB_HOST }}"
          DB_PORT="${{ steps.db.outputs.DB_PORT }}"
          DB_USER="${{ steps.db.outputs.DB_USER }}"
          DB_NAME="${{ steps.db.outputs.DB_NAME }}"
          export PGPASSWORD="${{ steps.db.outputs.PGPASSWORD }}"

          ANY_PENDING=0
          ANY_ERROR=0
          ANY_ROWS=0

          for name in $MODULES; do
            schema="${SCHEMA[$name]}"

            # (1) What migrations exist in the repo for this module? Use --no-connect
            #     so EF doesn't try to read the DB — we'll do that ourselves with psql.
            EF_RAW="$(dotnet ef migrations list --no-build --configuration Release --no-connect \
                          -p "src/Trovesuite.Database.$name" \
                          -s src/Trovesuite.Database.Runner 2>&1 || true)"
            ALL_MIGS="$(echo "$EF_RAW" | grep -E '^[0-9]{14}_' || true)"

            if [[ -z "$ALL_MIGS" ]]; then
              echo "::warning::No migrations parsed from assembly for $name. dotnet-ef output below:"
              echo "$EF_RAW"
              echo "| $name | _(no migration files in repo — see step log)_ | ⚠️ error |" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ANY_ERROR=1
              continue
            fi

            # (2) What's actually applied on this DB? Try the per-schema table first
            #     and ALSO the legacy public.__EFMigrationsHistory in case some rows
            #     are still there from before the MigrationsHistoryTable fix.
            #     Column name in the per-schema table is snake_cased (migration_id);
            #     in legacy public it's the original "MigrationId" (PascalCase).
            APPLIED_NEW="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                            -v ON_ERROR_STOP=0 -tA --no-psqlrc \
                            -c "SELECT migration_id FROM \"$schema\".\"__EFMigrationsHistory\" ORDER BY 1" \
                            2>/dev/null || true)"
            APPLIED_LEGACY="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                                -v ON_ERROR_STOP=0 -tA --no-psqlrc \
                                -c "SELECT \"MigrationId\" FROM public.\"__EFMigrationsHistory\" ORDER BY 1" \
                                2>/dev/null || true)"
            APPLIED="$(printf '%s\n%s' "$APPLIED_NEW" "$APPLIED_LEGACY" | sort -u)"

            # If psql itself can't connect (wrong creds, network), distinguish
            # that from "schema doesn't exist" by probing the server with a
            # trivial query.
            if ! psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                      -tA --no-psqlrc -c "SELECT 1" >/dev/null 2>&1; then
              echo "| $name | _(connection failed)_ | ⚠️ unknown |" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ANY_ERROR=1
              continue
            fi

            while IFS= read -r mig; do
              [[ -z "$mig" ]] && continue
              if echo "$APPLIED" | grep -qx "$mig"; then
                state="✅ Applied"
              else
                state="🟡 Pending"
                ANY_PENDING=1
              fi
              echo "| $name | \`$mig\` | $state |" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ANY_ROWS=1
            done <<< "$ALL_MIGS"
          done

          # Attendance is a newer module — surface whether the schema actually has
          # tables (history can claim Applied while DDL never landed).
          if echo "$MODULES" | grep -qw Attendance; then
            {
              echo ""
              echo "### Attendance schema tables"
              echo ""
              echo '```'
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                -v ON_ERROR_STOP=0 --no-psqlrc \
                -c "SELECT tablename FROM pg_tables WHERE schemaname = 'attendance' ORDER BY 1;" \
                2>&1 || echo "(psql probe failed)"
              echo ""
              echo "-- att_devices columns --"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                -v ON_ERROR_STOP=0 --no-psqlrc \
                -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='attendance' AND table_name='att_devices' ORDER BY ordinal_position;" \
                2>&1 || true
              echo ""
              echo "-- att_attendance_records columns --"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                -v ON_ERROR_STOP=0 --no-psqlrc \
                -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='attendance' AND table_name='att_attendance_records' ORDER BY ordinal_position;" \
                2>&1 || true
              echo ""
              echo "-- privileges on attendance schema --"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                -v ON_ERROR_STOP=0 --no-psqlrc \
                -c "SELECT n.nspname, r.rolname, has_schema_privilege(r.oid, n.oid, 'USAGE') AS usage, has_schema_privilege(r.oid, n.oid, 'CREATE') AS create FROM pg_namespace n CROSS JOIN pg_roles r WHERE n.nspname='attendance' AND r.rolname NOT LIKE 'pg_%' AND (has_schema_privilege(r.oid, n.oid, 'USAGE') OR r.rolname LIKE '%zelos%' OR r.rolname LIKE '%app%' OR r.rolname LIKE '%migrat%') ORDER BY 2;" \
                2>&1 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Trailing legend / hint.
          {
            echo ""
            if [[ "$ANY_ERROR" == "1" ]]; then
              echo "⚠️  One or more modules couldn't be read from the DB. Check the step log."
            elif [[ "$ANY_PENDING" == "1" ]]; then
              echo "🟡 **Pending** migrations exist for this environment. Run \`command=deploy\` to apply them."
            elif [[ "$ANY_ROWS" == "1" ]]; then
              echo "✅ Everything in the repo is applied to **$ENV_LABEL**."
            else
              echo "ℹ️  No migrations found in the repo for the selected module(s)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
