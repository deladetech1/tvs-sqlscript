# Auto-deploy EF Core migrations to saas-dev when changes merge to the `dev`
# branch. Deploys ALL modules (core_platform → loandrift → mystoreguard → zeloshr).
#
#   dev push → GitHub Environment saas-dev (DATABASE_URL)
#
# This is the ONLY automatic database deploy. Prod and tenants are deliberate:
# run the manual "Database (EF Core dispatch)" workflow (database-dispatch.yml)
# and pick scope + environment. Application deploys never migrate a DB.

name: Database deploy (saas-dev auto)

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "migrations/**"
      - "Directory.Build.props"
      - "Trovesuite.Database.sln"
      - ".github/workflows/database-deploy-branches.yml"

concurrency:
  group: tvs-sqlscript-deploy-saas-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 deploy → saas-dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: saas-dev

    defaults:
      run:
        shell: bash

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TVS_SSL: Require
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build Trovesuite.Database.sln -c Release --nologo

      - name: Parse DATABASE_URL into env vars
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::DATABASE_URL is not set on environment 'saas-dev'."
            exit 1
          fi
          echo "::add-mask::${DATABASE_URL}"

          proto_stripped="${DATABASE_URL#postgresql://}"
          proto_stripped="${proto_stripped#postgres://}"
          creds="${proto_stripped%%@*}"
          rest="${proto_stripped#*@}"
          DB_USER="${creds%%:*}"
          PGPASSWORD="${creds#*:}"
          hostport="${rest%%/*}"
          DB_HOST="${hostport%%:*}"
          DB_PORT="${hostport#*:}"
          [[ "$DB_PORT" == "$hostport" ]] && DB_PORT=5432
          dbpart="${rest#*/}"
          DB_NAME="${dbpart%%\?*}"

          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_HOST"

          {
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_USER=$DB_USER"
            echo "PGPASSWORD=$PGPASSWORD"
            echo "DB_NAME=$DB_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: 📍 Target summary
        run: |
          {
            echo "## 🚀 Auto deploy → \`saas-dev\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Modules** | all (incl. zeloshr / ZelosHR) |"
            echo "| **DB host** | \`${{ steps.db.outputs.DB_HOST }}\` |"
            echo "| **DB name** | \`${{ steps.db.outputs.DB_NAME }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 deploy all modules
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          DB_USER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
        run: |
          echo "::group::Runner output (module pick 0 = ALL)"
          printf '0\n' \
            | dotnet run --no-build -c Release \
                --project src/Trovesuite.Database.Runner -- \
                "$DB_HOST" "$DB_PORT" "$DB_USER" "$PGPASSWORD" "$DB_NAME" deploy
          echo "::endgroup::"
          echo "::notice title=✅ deploy succeeded::${{ github.ref_name }} → saas-dev"
