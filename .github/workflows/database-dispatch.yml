# Manual EF Core deploys, rollbacks, and migration-tooling commands against a
# Postgres reachable from GitHub-hosted runners (Azure, RDS, Neon, etc.).
#
# Two-axis target picker:
#
#   scope ─────────────► WHO the DB belongs to
#     • saas                = your team (no enterprise-specific SQL applied)
#     • enterprise-<slug>   = a specific customer (also runs migrations/enterprise/<slug>/*)
#
#   environment ───────► WHICH DB of theirs
#     • dev / stage / prod
#
# GitHub Environment name = `<scope>-<environment>`:
#
#   ┌──────────────────────────────────┬────────────────┬────────────────────────┐
#   │ GitHub Environment               │ Secret         │ Suggested protection   │
#   ├──────────────────────────────────┼────────────────┼────────────────────────┤
#   │ saas-dev                         │ DATABASE_URL   │ none                   │
#   │ saas-stage                       │ DATABASE_URL   │ wait-timer             │
#   │ saas-prod                        │ DATABASE_URL   │ Required reviewers     │
#   │ enterprise-bidtl-dev    (opt.)   │ DATABASE_URL   │                        │
#   │ enterprise-bidtl-stage  (opt.)   │ DATABASE_URL   │                        │
#   │ enterprise-bidtl-prod            │ DATABASE_URL   │ Required reviewers     │
#   │ enterprise-acme-prod             │ DATABASE_URL   │ Required reviewers     │
#   └──────────────────────────────────┴────────────────┴────────────────────────┘
#
# Each row that actually exists is a real GitHub Environment. Enterprises that
# only run production just don't create the dev/stage entries.
#
# DATABASE_URL format (libpq URL):
#   postgresql://user:password@host.example.com:5432/dbname?sslmode=require
#
# ── ONBOARDING A NEW ENTERPRISE ──────────────────────────────────────────────
#   1. Get the libpq URL(s) from the enterprise — one per DB they want managed
#      (typically just `production`, sometimes `staging` + `production`).
#   2. Repo → Settings → Environments → New environment for each:
#        name = `enterprise-<slug>-<env>`   e.g. `enterprise-acme-production`
#        Add environment secret: DATABASE_URL = <the libpq URL>
#        (Recommended for production) Add required reviewers.
#   3. Edit this workflow file: add `- enterprise-<slug>` to `scope.options`.
#      Commit, push.
#   4. Run the workflow with scope=`enterprise-<slug>` + environment=`production`
#      + command=`validate` (no DB writes), then `deploy`.
#
#   Migration history is recorded per database via __EFMigrationsHistory, so
#   each enterprise is upgraded independently and idempotently. An enterprise
#   sitting two migrations behind catches up automatically on the next deploy.
#
# Concurrency: one in-flight job per repo + (scope-environment) so two dispatch
# runs never fight the same DB.

name: Database (EF Core dispatch)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'WHO the DB belongs to: saas (your team) or a specific enterprise'
        required: true
        type: choice
        options:
          - saas
          # Per-enterprise scopes. Add `- enterprise-<slug>` here as you onboard
          # new customers. The slug (text after `enterprise-`) is what the
          # Runner uses to find migrations/enterprise/<slug>/*.sql.
          - enterprise-bidtl
      environment:
        description: 'WHICH DB of theirs: dev / stage / prod'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      command:
        description: What to do
        type: choice
        required: true
        options:
          - validate          # offline — builds every EF model, no DB touch
          - verify            # connects, prints PG version + current_database()
          - status            # alias for verify
          - deploy            # CREATE SCHEMA + MigrateAsync + triggers + seeds
          - rollback          # DROP SCHEMA … CASCADE (destructive)
          - migrations-list   # show applied vs pending per module on this env
      module:
        description: Module to target ("all" is fine for every command)
        type: choice
        required: true
        default: all
        options:
          - all
          - core_platform
          - loandrift
          - mystoreguard
          - human_resource
      destructive_ack:
        description: 'For rollback only: type exactly YESDestructive'
        type: string
        required: false
        default: ""

concurrency:
  # One in-flight job per (repo, scope, environment) — two runs against the
  # same DB queue, but saas-dev and enterprise-acme-prod run in parallel.
  group: tvs-sqlscript-${{ github.repository }}-${{ inputs.scope }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run:
    # Dynamic job name → shows up as the run title in the Actions list, the
    # run-page header, and email/Slack notifications. Encodes:
    #   • a command-specific emoji   (🚀 deploy, 💥 rollback, 🔍 validate, …)
    #   • the command                (deploy / verify / status / rollback / migrations-list / validate)
    #   • the target GitHub Environment            (e.g. enterprise-bidtl-dev)
    #   • the module                 (all / core_platform / …)
    #   • who triggered it           (@github-handle)
    name: >-
      ${{
        inputs.command == 'deploy'           && '🚀'  ||
        inputs.command == 'rollback'         && '💥'  ||
        inputs.command == 'validate'         && '🔍'  ||
        inputs.command == 'verify'           && '🩺'  ||
        inputs.command == 'status'           && '🩺'  ||
        inputs.command == 'migrations-list'  && '🗃️' ||
        '▶️'
      }}
      ${{ inputs.command }}
      → ${{ inputs.scope }}-${{ inputs.environment }}
      · ${{ inputs.module }}
      · @${{ github.actor }}

    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    # Bind the job to the chosen GitHub Environment. Naming convention:
    # `<scope>-<environment>` — e.g. saas-dev, saas-stage, saas-prod,
    # enterprise-bidtl-prod, enterprise-acme-stage.
    # This is what unlocks:
    #   - env-scoped secrets (DATABASE_URL),
    #   - required reviewers / wait-timer protection rules,
    #   - the env tag in the run UI.
    environment: ${{ inputs.scope }}-${{ inputs.environment }}

    defaults:
      run:
        shell: bash

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Force SSL for all cloud Postgres connections.
      TVS_SSL: Require
      # actions/checkout@v4 + actions/setup-dotnet@v4 still bundle a Node 20
      # runtime. GitHub is dropping Node 20 in Sep 2026; this flag tells the
      # runner to run them on Node 24 instead, silencing the deprecation
      # warning. Remove once those actions publish v5 with native Node 24.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build Trovesuite.Database.sln -c Release --nologo

      - name: Install dotnet-ef tool
        if: startsWith(github.event.inputs.command, 'migrations-')
        run: dotnet tool install --global dotnet-ef --version 10.0.1

      - name: Parse DATABASE_URL into env vars
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::DATABASE_URL is not set on environment '${{ inputs.scope }}-${{ inputs.environment }}'. Open Settings → Environments → ${{ inputs.scope }}-${{ inputs.environment }} → Add secret."
            exit 1
          fi
          # Mask the URL so it never lands in logs.
          echo "::add-mask::${DATABASE_URL}"

          # libpq URL → individual fields. Format:
          #   postgresql://user:password@host:port/dbname?sslmode=require
          proto_stripped="${DATABASE_URL#postgresql://}"
          proto_stripped="${proto_stripped#postgres://}"
          creds="${proto_stripped%%@*}"
          rest="${proto_stripped#*@}"
          DB_USER="${creds%%:*}"
          PGPASSWORD="${creds#*:}"
          hostport="${rest%%/*}"
          DB_HOST="${hostport%%:*}"
          DB_PORT="${hostport#*:}"
          [[ "$DB_PORT" == "$hostport" ]] && DB_PORT=5432
          dbpart="${rest#*/}"
          DB_NAME="${dbpart%%\?*}"

          # Mask everything sensitive too.
          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_HOST"

          {
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_USER=$DB_USER"
            echo "PGPASSWORD=$PGPASSWORD"
            echo "DB_NAME=$DB_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Destructive-command typo safeguard
        if: inputs.command == 'rollback'
        run: |
          set -euo pipefail
          if [[ "${{ inputs.destructive_ack }}" != "YESDestructive" ]]; then
            echo "::error::rollback requires destructive_ack=YESDestructive (typo safeguard, separate from environment protection rules)."
            exit 1
          fi

      - name: Map module → csproj path
        id: map
        run: |
          set -euo pipefail
          case "${{ inputs.module }}" in
            core_platform)  PROJ="src/Trovesuite.Database.CorePlatform";  PICK=1 ;;
            loandrift)      PROJ="src/Trovesuite.Database.LoanDrift";     PICK=2 ;;
            mystoreguard)   PROJ="src/Trovesuite.Database.MyStoreGuard";  PICK=3 ;;
            human_resource) PROJ="src/Trovesuite.Database.HumanResource"; PICK=4 ;;
            all)            PROJ="";                                       PICK=0 ;;
          esac
          echo "proj=$PROJ" >> "$GITHUB_OUTPUT"
          echo "pick=$PICK" >> "$GITHUB_OUTPUT"

      - name: Extract enterprise slug
        id: enterprise
        run: |
          # If scope starts with "enterprise-", the suffix is the slug that
          # maps to migrations/enterprise/<slug>/.  Scope=saas leaves the
          # slug empty so the Runner skips the enterprise folder.
          SCOPE="${{ inputs.scope }}"
          if [[ "$SCOPE" == enterprise-* ]]; then
            SLUG="${SCOPE#enterprise-}"
          else
            SLUG=""
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: 📍 Target summary
        run: |
          ENV_LABEL="${{ inputs.scope }}-${{ inputs.environment }}"
          COMMAND="${{ inputs.command }}"
          MODULE="${{ inputs.module }}"
          SLUG="${{ steps.enterprise.outputs.slug }}"
          DB_HOST="${{ steps.db.outputs.DB_HOST }}"
          DB_NAME="${{ steps.db.outputs.DB_NAME }}"
          TRIGGER_USER="${{ github.actor }}"
          GIT_REF="${{ github.ref_name }} @ ${{ github.sha }}"

          # Pretty banner in the step log
          {
            echo "════════════════════════════════════════════════════════════"
            printf "  🎯  Action      : %s\n"  "$COMMAND"
            printf "  📦  Target env  : %s\n"  "$ENV_LABEL"
            printf "  🗄️   Host         : %s\n" "$DB_HOST"
            printf "  💾  Database    : %s\n"  "$DB_NAME"
            printf "  🧩  Module(s)   : %s\n"  "$MODULE"
            if [[ -n "$SLUG" ]]; then
              printf "  🏢  Enterprise  : %s  (runs migrations/enterprise/%s/)\n" "$SLUG" "$SLUG"
            else
              printf "  🏢  Enterprise  : (none — scope=saas, no per-customer SQL)\n"
            fi
            printf "  👤  Triggered by: %s\n"  "$TRIGGER_USER"
            printf "  🔖  Source      : %s\n"  "$GIT_REF"
            echo "════════════════════════════════════════════════════════════"
          }

          # Same info as a one-line GitHub annotation that floats to the top
          # of the run UI — easy to spot without opening the step log.
          echo "::notice title=$COMMAND → $ENV_LABEL::Module=$MODULE  Host=$DB_HOST  DB=$DB_NAME  Enterprise=${SLUG:-none}  By=$TRIGGER_USER"

          # And as a sticky header on the workflow run's Summary tab.
          {
            echo "## 🎯 \`$COMMAND\` → \`$ENV_LABEL\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Action**       | \`$COMMAND\` |"
            echo "| **Target env**   | \`$ENV_LABEL\` |"
            echo "| **DB host**      | \`$DB_HOST\` |"
            echo "| **DB name**      | \`$DB_NAME\` |"
            echo "| **Module(s)**    | \`$MODULE\` |"
            if [[ -n "$SLUG" ]]; then
              echo "| **Enterprise**   | \`$SLUG\` (extras from \`migrations/enterprise/$SLUG/\`) |"
            else
              echo "| **Enterprise**   | _none — scope=saas_ |"
            fi
            echo "| **Triggered by** | @$TRIGGER_USER |"
            echo "| **Source**       | \`$GIT_REF\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Runner actions: validate / verify / status / deploy / rollback
      # ------------------------------------------------------------------
      - name: 🚀 ${{ inputs.command }} → ${{ inputs.scope }}-${{ inputs.environment }}
        if: contains(fromJson('["deploy","verify","status","validate"]'), inputs.command)
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          DB_USER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
          # Empty for dev/stage/prod under scope=saas; set for enterprise-<slug>.
          # The Runner uses this to pick migrations/enterprise/<slug>/.
          TVS_ENTERPRISE: ${{ steps.enterprise.outputs.slug }}
        run: |
          echo "::group::Starting ${{ inputs.command }} on ${{ inputs.scope }}-${{ inputs.environment }}"
          echo "Module pick: ${{ steps.map.outputs.pick }} (0=ALL, 1=core_platform, 2=loandrift, 3=mystoreguard, 4=human_resource)"
          [[ -n "$TVS_ENTERPRISE" ]] \
            && echo "TVS_ENTERPRISE=$TVS_ENTERPRISE → migrations/enterprise/$TVS_ENTERPRISE/*.sql will also run" \
            || echo "TVS_ENTERPRISE=(unset) → migrations/enterprise/ skipped"
          echo "::endgroup::"

          # Pipe the module choice (0 for ALL, 1..4 for specific). The Runner
          # already prints its own ===== banner per module; we collapse the
          # whole Runner output into a single ::group:: for readability.
          echo "::group::Runner output"
          printf '%s\n' "${{ steps.map.outputs.pick }}" \
            | dotnet run --no-build -c Release \
                --project src/Trovesuite.Database.Runner -- \
                "$DB_HOST" "$DB_PORT" "$DB_USER" "$PGPASSWORD" "$DB_NAME" "${{ inputs.command }}"
          echo "::endgroup::"
          echo "::notice title=✅ ${{ inputs.command }} succeeded::Target ${{ inputs.scope }}-${{ inputs.environment }} — module(s)=${{ inputs.module }}"

      - name: 💥 rollback → ${{ inputs.scope }}-${{ inputs.environment }}
        if: inputs.command == 'rollback'
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          DB_USER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
        run: |
          echo "::warning title=DESTRUCTIVE: rollback::DROP SCHEMA … CASCADE on ${{ inputs.scope }}-${{ inputs.environment }} for module(s)=${{ inputs.module }}"
          echo "::group::Runner output"
          # Rollback asks for module choice AND a y/N confirmation.
          printf '%s\ny\n' "${{ steps.map.outputs.pick }}" \
            | dotnet run --no-build -c Release \
                --project src/Trovesuite.Database.Runner -- \
                "$DB_HOST" "$DB_PORT" "$DB_USER" "$PGPASSWORD" "$DB_NAME" "rollback"
          echo "::endgroup::"
          echo "::notice title=💥 rollback complete::Schemas dropped on ${{ inputs.scope }}-${{ inputs.environment }} — module(s)=${{ inputs.module }}"

      # ------------------------------------------------------------------
      # dotnet ef migrations …
      # ------------------------------------------------------------------
      - name: migrations-list
        if: inputs.command == 'migrations-list'
        env:
          # Pass the parsed DB connection through so `dotnet ef migrations list`
          # can mark each migration as Applied/Pending against this environment's
          # actual DB (instead of the design-time placeholder).
          TVS_DESIGN_CONNECTION: >-
            Host=${{ steps.db.outputs.DB_HOST }};Port=${{ steps.db.outputs.DB_PORT }};Username=${{ steps.db.outputs.DB_USER }};Password=${{ steps.db.outputs.PGPASSWORD }};Database=${{ steps.db.outputs.DB_NAME }};SSL Mode=Require;Trust Server Certificate=true
        run: |
          set -euo pipefail

          # Modules to query.
          if [[ "${{ inputs.module }}" == "all" ]]; then
            MODULES="CorePlatform LoanDrift MyStoreGuard HumanResource"
          else
            case "${{ inputs.module }}" in
              core_platform)  MODULES="CorePlatform" ;;
              loandrift)      MODULES="LoanDrift" ;;
              mystoreguard)   MODULES="MyStoreGuard" ;;
              human_resource) MODULES="HumanResource" ;;
            esac
          fi

          ENV_LABEL="${{ inputs.scope }}-${{ inputs.environment }}"

          # Render the same Markdown table into:
          #   - console (so the step log is readable),
          #   - $GITHUB_STEP_SUMMARY (so it shows nicely on the run's Summary tab).
          {
            echo "## 🗃️  Migration status — \`$ENV_LABEL\`"
            echo ""
            echo "| Module | Migration | State |"
            echo "| --- | --- | --- |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Map our module name → its Postgres schema (where __EFMigrationsHistory lives).
          declare -A SCHEMA=(
            [CorePlatform]=core_platform
            [LoanDrift]=loandrift
            [MyStoreGuard]=mystoreguard
            [HumanResource]=human_resource
          )

          DB_HOST="${{ steps.db.outputs.DB_HOST }}"
          DB_PORT="${{ steps.db.outputs.DB_PORT }}"
          DB_USER="${{ steps.db.outputs.DB_USER }}"
          DB_NAME="${{ steps.db.outputs.DB_NAME }}"
          export PGPASSWORD="${{ steps.db.outputs.PGPASSWORD }}"

          ANY_PENDING=0
          ANY_ERROR=0
          ANY_ROWS=0

          for name in $MODULES; do
            schema="${SCHEMA[$name]}"

            # (1) What migrations exist in the repo for this module? Use --no-connect
            #     so EF doesn't try to read the DB — we'll do that ourselves with psql.
            EF_RAW="$(dotnet ef migrations list --no-build --configuration Release --no-connect \
                          -p "src/Trovesuite.Database.$name" \
                          -s src/Trovesuite.Database.Runner 2>&1 || true)"
            ALL_MIGS="$(echo "$EF_RAW" | grep -E '^[0-9]{14}_' || true)"

            if [[ -z "$ALL_MIGS" ]]; then
              echo "::warning::No migrations parsed from assembly for $name. dotnet-ef output below:"
              echo "$EF_RAW"
              echo "| $name | _(no migration files in repo — see step log)_ | ⚠️ error |" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ANY_ERROR=1
              continue
            fi

            # (2) What's actually applied on this DB? Try the per-schema table first
            #     and ALSO the legacy public.__EFMigrationsHistory in case some rows
            #     are still there from before the MigrationsHistoryTable fix.
            #     Column name in the per-schema table is snake_cased (migration_id);
            #     in legacy public it's the original "MigrationId" (PascalCase).
            APPLIED_NEW="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                            -v ON_ERROR_STOP=0 -tA --no-psqlrc \
                            -c "SELECT migration_id FROM \"$schema\".\"__EFMigrationsHistory\" ORDER BY 1" \
                            2>/dev/null || true)"
            APPLIED_LEGACY="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                                -v ON_ERROR_STOP=0 -tA --no-psqlrc \
                                -c "SELECT \"MigrationId\" FROM public.\"__EFMigrationsHistory\" ORDER BY 1" \
                                2>/dev/null || true)"
            APPLIED="$(printf '%s\n%s' "$APPLIED_NEW" "$APPLIED_LEGACY" | sort -u)"

            # If psql itself can't connect (wrong creds, network), distinguish
            # that from "schema doesn't exist" by probing the server with a
            # trivial query.
            if ! psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                      -tA --no-psqlrc -c "SELECT 1" >/dev/null 2>&1; then
              echo "| $name | _(connection failed)_ | ⚠️ unknown |" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ANY_ERROR=1
              continue
            fi

            while IFS= read -r mig; do
              [[ -z "$mig" ]] && continue
              if echo "$APPLIED" | grep -qx "$mig"; then
                state="✅ Applied"
              else
                state="🟡 Pending"
                ANY_PENDING=1
              fi
              echo "| $name | \`$mig\` | $state |" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ANY_ROWS=1
            done <<< "$ALL_MIGS"
          done

          # Trailing legend / hint.
          {
            echo ""
            if [[ "$ANY_ERROR" == "1" ]]; then
              echo "⚠️  One or more modules couldn't be read from the DB. Check the step log."
            elif [[ "$ANY_PENDING" == "1" ]]; then
              echo "🟡 **Pending** migrations exist for this environment. Run \`command=deploy\` to apply them."
            elif [[ "$ANY_ROWS" == "1" ]]; then
              echo "✅ Everything in the repo is applied to **$ENV_LABEL**."
            else
              echo "ℹ️  No migrations found in the repo for the selected module(s)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

