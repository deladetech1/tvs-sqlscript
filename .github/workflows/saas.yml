# Schema for the SaaS pooled database -- the one every shared-infrastructure
# tenant lives in.
#
# Merging to `dev` or `saas` auto-deploys to the dev pool. Production is only a
# dispatch: same files, but the prod pool is every paying customer at once.
#
# Three workflows, one per class of target, because they roll out at different
# speeds and to different people's databases:
#
#   saas        this one -- the pooled database     auto on dev, prod by hand
#   silos       a tenant with its own database      auto on dev, prod by hand
#   enterprise  a customer hosting it themselves    always by hand
#
# The branch says which CLASS a change is for, not which tenant. All three share
# migrations/shared/, so a table change is written once and reaches every
# database. Everything below only decides WHICH database; apply.yml does the work.

name: saas

on:
  push:
    branches: [dev, saas]
    paths:
      - "src/**"
      - "migrations/shared/**"
      - "migrations/saas/**"
      - "Directory.Build.props"
      - "Trovesuite.Database.sln"
      - ".github/workflows/saas.yml"
      - ".github/workflows/apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which pool"
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      module:
        type: choice
        required: true
        default: all
        options: [all, core_platform, loandrift, mystoreguard, zeloshr, attendance]
      command:
        type: choice
        required: true
        default: validate
        options: [validate, verify, deploy]

concurrency:
  group: saas-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    # A push deploys everything to dev. A dispatch says what it wants, which is
    # the only way to reach prod.
    uses: ./.github/workflows/apply.yml
    with:
      label: saas ${{ inputs.environment || 'dev' }}
      environment: saas-${{ inputs.environment || 'dev' }}
      module: ${{ inputs.module || 'all' }}
      command: ${{ inputs.command || 'deploy' }}
      target_class: saas
      source: secret
    secrets:
      database_url: ${{ secrets.DATABASE_URL }}
