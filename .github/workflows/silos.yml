# Schema for the silo databases -- a tenant with its own database.
#
# Two kinds, one workflow with a switch, because the only difference is where the
# database lives:
#
#   shared      SILO_SHARED     own database on the shared server
#   dedicated   SILO_DEDICATED  own PostgreSQL server, possibly its own region
#                               and subscription
#   byod        SILO_BYOD       the CLIENT'S OWN database, in their cloud or
#                               data centre, which we did not build
#
# BYOD was missing from this workflow entirely until 20261008, which meant a
# client could have a correct route, correct credentials in our vault, and a
# database with no tables in it -- nothing applied the schema, and nothing said
# so. It is the one place a tier list being out of date is silent.
#
# Merging to the `silo` branch auto-deploys to BOTH kinds in DEV. Dev has exactly
# one of each, so "all" there is two databases and deploying them on merge is how
# the path gets exercised before a customer sees it. Prod is always a dispatch:
# those are customers' databases.
#
# Targets are derived from the route table, not listed here. A target is `all`
# or a host, and the run checks it against the ACTIVE silo rows in
# ctl_tenant_routes, refusing an unknown one by name -- the silent-typo failure
# (deploy to nothing, run goes green) cannot happen, and onboarding a client no
# longer needs an edit to this file.
#
# Also a REUSABLE workflow (workflow_call): tvs-iac's onboard-silo-app calls it
# for step 4 -- `uses: deladetech1/tvs-sqlscript/.github/workflows/silos.yml@master`
# for prod (`@silo` for dev) -- instead of dispatching it with a personal access
# token and polling (that token expired on 20261022 and step 4 401'd). Called, the
# jobs run in the CALLER's context: its org variables, and an OIDC subject of the
# caller's repo. gh_environment binds the Azure-login jobs to one of the caller's
# GitHub Environments (tvs-iac: platform-dev / platform-prod) so the subject is
# repo:deladetech1/tvs-iac:environment:platform-<env>, which tvs-oidc-auth-01
# already trusts. Dispatched or pushed here it is empty and nothing changes.
# Production SQL is still master whatever calls this: apply.yml decides it from
# target_env.
#
# Everything here only decides WHICH databases. apply.yml does the work, and
# refuses outright if a silo's secret resolves to the pooled database.

name: silos

on:
  push:
    branches: [silo]
    paths:
      - "src/**"
      - "migrations/shared/**"
      - "migrations/silo/**"
      - "Directory.Build.props"
      - "Trovesuite.Database.sln"
      - ".github/workflows/silos.yml"
      - ".github/workflows/apply.yml"
  workflow_call:
    inputs:
      kind:
        description: "all | shared | dedicated | byod"
        type: string
        required: true
      environment:
        description: "dev | prod"
        type: string
        required: true
      target:
        description: "all, or one silo host -- checked against ctl_tenant_routes below"
        type: string
        required: true
      module:
        type: string
        required: false
        default: all
      command:
        type: string
        required: false
        default: validate
      gh_environment:
        description: "A GitHub Environment of the CALLER's repository to bind the Azure-login jobs to (sets the OIDC subject). Empty = none."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      kind:
        description: "Which kind of silo"
        type: choice
        required: true
        default: all
        options: [all, shared, dedicated, byod]
      environment:
        description: "Which environment's silos"
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      target:
        # Typed, not a dropdown, since 20261022: the valid targets are the ACTIVE
        # silo rows in control_plane.ctl_tenant_routes, and the job below refuses
        # anything else by name -- so a typo fails loudly instead of deploying to
        # nothing, without a list here that every new client had to be added to
        # (tvs-iac register-byod-client registers the row and calls this).
        description: "all, or one silo host (an ACTIVE silo route in ctl_tenant_routes, e.g. itech.dev.trovesuite.com)"
        type: string
        required: true
        default: all
      module:
        type: choice
        required: true
        default: all
        options: [all, core_platform, loandrift, mystoreguard, zeloshr, attendance, accounting]
      command:
        type: choice
        required: true
        default: validate
        options: [validate, verify, status, deploy, migrations-list, rollback]
      destructive_ack:
        description: 'For rollback only: type exactly YESDestructive'
        type: string
        default: ""

concurrency:
  group: silos-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  select:
    name: which silos
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ inputs.gh_environment || '' }}
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
      environment: ${{ steps.run.outputs.environment }}
      command: ${{ steps.run.outputs.command }}
      destructive_ack: ${{ inputs.destructive_ack }}
      module: ${{ steps.run.outputs.module }}
      subscription: ${{ steps.az.outputs.sub }}
    steps:
      - name: What this run is doing
        id: run
        env:
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_COMMAND: ${{ inputs.command }}
          IN_MODULE: ${{ inputs.module }}
          IN_KIND: ${{ inputs.kind }}
          IN_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # A merge deploys every dev silo. A dispatch (or a workflow_call) says
          # what it wants, and is the only way to reach prod. No inputs = a push:
          # github.event_name is the CALLER's event when this is called.
          if [ -z "$IN_ENVIRONMENT" ]; then
            printf 'environment=dev\ncommand=deploy\nmodule=all\nkind=all\ntarget=all\n' >> "$GITHUB_OUTPUT"
          else
            # A call is typed text, not a dropdown: check the words here.
            case "$IN_ENVIRONMENT" in dev|prod) ;; *) echo "::error::environment '$IN_ENVIRONMENT'"; exit 1 ;; esac
            case "$IN_KIND" in all|shared|dedicated|byod) ;; *) echo "::error::kind '$IN_KIND'"; exit 1 ;; esac
            case "$IN_COMMAND" in validate|verify|status|deploy|migrations-list|rollback) ;; *) echo "::error::command '$IN_COMMAND'"; exit 1 ;; esac
            [[ "$IN_TARGET" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::target '$IN_TARGET'"; exit 1; }
            [[ "$IN_MODULE" =~ ^[a-z_]+$ ]] || { echo "::error::module '$IN_MODULE'"; exit 1; }
            {
              echo "environment=$IN_ENVIRONMENT"
              echo "command=$IN_COMMAND"
              echo "module=$IN_MODULE"
              echo "kind=$IN_KIND"
              echo "target=$IN_TARGET"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Which subscription and vault
        id: az
        run: |
          set -euo pipefail
          case "${{ steps.run.outputs.environment }}" in
            dev)  echo "sub=${{ vars.TVS_DEV_SUBSCRIPTION_ID }}" >> "$GITHUB_OUTPUT"
                  echo "kv=tvs-dev-kv"  >> "$GITHUB_OUTPUT" ;;
            prod) echo "sub=${{ vars.TVS_PROD_SUBSCRIPTION_ID }}" >> "$GITHUB_OUTPUT"
                  echo "kv=tvs-prod-kv" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.TVS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.TVS_TENANT_ID }}
          subscription-id: ${{ steps.az.outputs.sub }}

      - name: Check the selection against the control plane
        id: pick
        env:
          KV: ${{ steps.az.outputs.kv }}
          KIND: ${{ steps.run.outputs.kind }}
          TARGET: ${{ steps.run.outputs.target }}
        run: |
          set -euo pipefail
          CP_URL="$(az keyvault secret show --vault-name "$KV" --name migrator-db-url --query value -o tsv)"
          echo "::add-mask::$CP_URL"

          # Host, tier and silo key only -- never a credential. apply.yml reads
          # each silo's own secret itself, so nothing sensitive crosses a job.
          #
          # silo_key, not db_secret_uri -- FOR THE SILOS WE BUILD. The route
          # row's secret column was the right source while a silo had ONE
          # credential; it now has a login per APP, so the column is NULL and
          # five db-url-<app>-<silo> secrets stand in its place -- none of which
          # this workflow should use. Migrations run as the MIGRATOR, which
          # Terraform writes to migrator-db-url-<silo>, so the key is what this
          # needs and the name is derived from it below.
          #
          # SILO_BYOD can be either, which is why db_secret_uri is selected
          # too. Nothing of ours built that database, so there is no Terraform
          # writing migrator-db-url-<silo> for it. Two shapes:
          #   * one credential the client gave us, on the row as db_secret_uri
          #     -- that is the only thing that can run a migration;
          #   * per-app logins (db-url-<app>-<silo>, as BGCLT has) with the row
          #     naming only its silo_key and db_secret_uri NULL, so the apps do
          #     NOT connect as the owner -- then we put the client's migrator
          #     credential in our vault as migrator-db-url-<silo> by hand and
          #     migrate with that, exactly as for our own silos.
          #
          # db_server_fqdn is selected only to run each DATABASE once: a silo
          # with several hosts (BGCLT has six) is one database, and running the
          # same migrations into it in parallel jobs would race.
          export ROWS="$(psql "$CP_URL" -At -F'|' -c "
            SELECT host, tier, db_name, silo_key, coalesce(db_secret_uri, ''),
                   coalesce(db_server_fqdn, '')
              FROM control_plane.ctl_tenant_routes
             WHERE status = 'ACTIVE'
               AND tier IN ('SILO_SHARED','SILO_DEDICATED','SILO_BYOD')
             ORDER BY tier, host")"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          TIER = {"shared": "SILO_SHARED", "dedicated": "SILO_DEDICATED",
                  "byod": "SILO_BYOD"}
          kind, target = os.environ["KIND"], os.environ["TARGET"]
          VAULT = f"https://{os.environ['KV']}.vault.azure.net"

          live = {}
          for line in os.environ["ROWS"].strip().splitlines():
              if not line.strip():
                  continue
              host, tier, db, silo_key, db_secret_uri, server = line.split("|")
              if not silo_key:
                  print(f"::error::{host} is {tier} but names no silo_key, so its "
                        f"migrator credential cannot be found. Refusing.", file=sys.stderr)
                  sys.exit(1)

              if tier == "SILO_BYOD":
                  # THEIR credential. With db_secret_uri on the row, that one
                  # login is everything we have, so it has to be allowed to run
                  # migrations: a client who hands us a login that cannot create
                  # tables has handed us a database we cannot use, and that is a
                  # conversation to have at onboarding.
                  #
                  # With only a silo_key (per-app logins, db_secret_uri NULL) the
                  # apps compose db-url-<app>-<silo>, and migrations use
                  # migrator-db-url-<silo> -- the client's owner credential,
                  # copied into our vault at onboarding (no Terraform writes it
                  # for a database we did not build). The silo_key check above
                  # has already refused a row with neither.
                  secret_uri = (db_secret_uri
                                or f"{VAULT}/secrets/migrator-db-url-{silo_key}")
                  # NOT `kind`: that name holds the FILTER the dispatch asked
                  # for, and assigning it here overwrote it with whichever row
                  # happened to be last -- so every choice of kind returned the
                  # last silo. The test caught it; reading the diff did not.
                  silo_kind = "byod"
              else:
                  # The migrator for THIS silo, which Terraform's migrator-secret
                  # unit writes. The pooled migrator-db-url names dev-db, so using
                  # it would run a silo's migration against the shared database and
                  # report success.
                  secret_uri = f"{VAULT}/secrets/migrator-db-url-{silo_key}"
                  silo_kind = "shared" if tier == "SILO_SHARED" else "dedicated"

              live[host] = {
                  "host": host, "tier": tier, "db": db, "silo_key": silo_key,
                  "secret_uri": secret_uri,
                  "kind": silo_kind,
                  "server": server,
              }

          picked = list(live.values())
          if kind != "all":
              picked = [s for s in picked if s["tier"] == TIER[kind]]
          if target != "all":
              if target not in live:
                  print(f"::error::'{target}' is not an ACTIVE silo route in "
                        f"ctl_tenant_routes. Live: {', '.join(sorted(live)) or '(none)'}",
                        file=sys.stderr)
                  raise SystemExit(1)
              picked = [s for s in picked if s["host"] == target]
              if not picked:
                  print(f"::error::'{target}' exists but is not kind='{kind}' "
                        f"(it is {live[target]['kind']}).", file=sys.stderr)
                  raise SystemExit(1)

          # ONE job per database: the first host (rows are ordered) stands for
          # the rest. Hosts sharing a database share its credential by
          # construction, so which one is chosen does not change what runs.
          once, seen = [], set()
          for s in picked:
              k = (s["server"], s["db"])
              if k in seen:
                  continue
              seen.add(k)
              once.append(s)
          picked = once

          print("matrix=" + json.dumps({"include": picked}))
          print(f"count={len(picked)}")
          PY

      - name: Summary
        run: |
          {
            echo "## silos · ${{ steps.run.outputs.command }} · ${{ steps.run.outputs.environment }}"
            echo ""
            echo "kind \`${{ steps.run.outputs.kind }}\` · target \`${{ steps.run.outputs.target }}\` · **${{ steps.pick.outputs.count }} selected**"
            echo ""
            echo "| host | kind | database |"
            echo "| --- | --- | --- |"
            echo '${{ steps.pick.outputs.matrix }}' | python3 -c "
          import json,sys
          for s in json.load(sys.stdin)['include']:
              print(f\"| \`{s['host']}\` | {s['kind']} | \`{s['db']}\` |\")"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: select
    if: needs.select.outputs.count != '0'
    # One silo per job, and fail-fast off: a tenant mid-migration must not stop
    # the rest getting the schema.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    # The FULL path: called from another repository, a relative `uses:` can
    # resolve against the caller (see migrate.yml).
    uses: deladetech1/tvs-sqlscript/.github/workflows/apply.yml@master
    with:
      environment: ${{ inputs.gh_environment || '' }}
      label: ${{ matrix.kind }} · ${{ matrix.host }}
      module: ${{ needs.select.outputs.module }}
      command: ${{ needs.select.outputs.command }}
      target_env: ${{ needs.select.outputs.environment }}
      target_class: silo
      silo_host: ${{ matrix.host }}
      source: keyvault
      secret_uri: ${{ matrix.secret_uri }}
      subscription_id: ${{ needs.select.outputs.subscription }}
      azure_client_id: ${{ vars.TVS_AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.TVS_TENANT_ID }}
      refuse_pooled_database: true
