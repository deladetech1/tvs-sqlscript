# Called by each backend's deploy pipeline to apply that backend's schema BEFORE
# the new image rolls out. The input contract is unchanged -- scope, environment,
# module, command -- because app repos pin this file by name at @dev and breaking
# it would break their deploys.
#
# It used to carry its own copy of the build, the DATABASE_URL parser and the
# module mapping. All of that now lives in apply.yml, and this only resolves
# WHICH database a (scope, environment) means:
#
#   saas/dev              -> tvs-dev-kv      migrator-db-url
#   saas/prod             -> tvs-prod-kv     migrator-db-url
#   enterprise-<slug>/<e> -> <slug>-<e>-kv   migrator-db-url
#
# The credential never leaves apply.yml: this passes the secret's URI, not its
# value, so nothing sensitive crosses a job boundary.

name: apply (reusable, for app pipelines)

on:
  workflow_call:
    inputs:
      scope:
        description: "saas | enterprise-<slug>"
        required: true
        type: string
      environment:
        description: "dev | prod"
        required: true
        type: string
      module:
        description: "core_platform | loandrift | mystoreguard | zeloshr | attendance | all"
        required: false
        type: string
        default: all
      command:
        description: "deploy | validate | verify (defaults to deploy)"
        required: false
        type: string
        default: deploy

concurrency:
  # One in-flight migration per (repo, scope, environment) -- a backend deploy and
  # a manual dispatch against the same DB queue instead of racing.
  group: tvs-sqlscript-${{ github.repository }}-${{ inputs.scope }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    name: which database
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.az.outputs.client_id }}
      subscription: ${{ steps.az.outputs.subscription_id }}
      secret_uri: ${{ steps.az.outputs.secret_uri }}
      target_class: ${{ steps.az.outputs.target_class }}
      slug: ${{ steps.az.outputs.slug }}
    steps:
      - name: Map scope + environment to an identity and a vault
        id: az
        run: |
          set -euo pipefail
          SCOPE="${{ inputs.scope }}"; ENVN="${{ inputs.environment }}"
          TENANT="${{ vars.TVS_TENANT_ID }}"
          SLUG=""
          CLASS="saas"

          if [[ "$SCOPE" == "saas" ]]; then
            CLIENT="${{ vars.TVS_AZURE_CLIENT_ID }}"
            case "$ENVN" in
              dev)  SUB="${{ vars.TVS_DEV_SUBSCRIPTION_ID }}";  KV="tvs-dev-kv"  ;;
              prod) SUB="${{ vars.TVS_PROD_SUBSCRIPTION_ID }}"; KV="tvs-prod-kv" ;;
              *) echo "::error::unsupported saas environment '$ENVN'"; exit 1 ;;
            esac
          elif [[ "$SCOPE" == "enterprise-bgclt" ]]; then
            CLIENT="${{ vars.BGCLT_AZURE_CLIENT_ID }}"
            SUB="${{ vars.BGCLT_SUBSCRIPTION_ID }}"
            KV="bgclt-${ENVN}-kv"
            SLUG="bgclt"
            CLASS="enterprise"
          else
            echo "::error::unsupported scope '$SCOPE' — add its client-id / subscription / KV mapping here"; exit 1
          fi

          [ -n "$CLIENT" ] && [ -n "$SUB" ] && [ -n "$TENANT" ] \
            || { echo "::error::missing org variable for client/subscription/tenant (scope=$SCOPE env=$ENVN)"; exit 1; }

          {
            echo "client_id=$CLIENT"
            echo "subscription_id=$SUB"
            echo "secret_uri=https://$KV.vault.azure.net/secrets/migrator-db-url"
            echo "target_class=$CLASS"
            echo "slug=$SLUG"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::scope=$SCOPE env=$ENVN KV=$KV class=$CLASS"

  apply:
    needs: resolve
    # The FULL path, not ./.github/workflows/apply.yml. This workflow is called
    # from other repositories, and a relative `uses:` in a called workflow can
    # resolve against the CALLER's repository -- which has no apply.yml. Pinned
    # @dev to match how the app pipelines pin this file.
    uses: deladetech1/tvs-sqlscript/.github/workflows/apply.yml@dev
    with:
      label: ${{ inputs.scope }}-${{ inputs.environment }}
      module: ${{ inputs.module }}
      command: ${{ inputs.command }}
      target_class: ${{ needs.resolve.outputs.target_class }}
      enterprise_slug: ${{ needs.resolve.outputs.slug }}
      source: keyvault
      secret_uri: ${{ needs.resolve.outputs.secret_uri }}
      subscription_id: ${{ needs.resolve.outputs.subscription }}
      azure_client_id: ${{ needs.resolve.outputs.client_id }}
      azure_tenant_id: ${{ vars.TVS_TENANT_ID }}
