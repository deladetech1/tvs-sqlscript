# Reusable migration entrypoint — called by each backend's deploy pipeline
# (build-and-deploy-tvs.yml) to apply that backend's schema BEFORE the new image
# rolls out. The migrator (tvs_migrator) owns the schemas and runs them here; the
# apps connect with per-role CRUD creds and never migrate in real environments.
#
# Credential model: the migrator connection string (migrator-db-url) lives ONLY
# in Azure Key Vault. This workflow logs in with the caller's Azure OIDC identity
# and reads it at run time — so it is never stored as a GitHub secret in any repo.
# (Cross-repo reusable workflows resolve `environment:` against the CALLER, so a
# GitHub environment secret on tvs-sqlscript would not be visible here anyway.)
#
# Target axes:
#   scope        WHO the DB belongs to:  saas  |  enterprise-<slug>
#   environment  WHICH DB of theirs:     dev | prod
#   module       which app's schema:     core_platform | loandrift | mystoreguard
#                                         | human_resource | all
#
# Per (scope, environment) we resolve: the Azure SP client id (org variable), the
# subscription, and the Key Vault holding migrator-db-url — matching scripts/*.sh:
#   saas/dev  -> tvs-dev-kv      saas/prod -> tvs-prod-kv
#   enterprise-<slug>/<env>      -> <slug>-<env>-kv   (e.g. bgclt-prod -> bgclt-prod-kv)
#
# Azure prerequisites (one-time, per SP):
#   * Federated credential for each caller subject, e.g.
#       repo:deladetech1/tvs-<app>-bk:ref:refs/heads/dev   (and main / bgclt-prod)
#   * Key Vault "Secrets User" (RBAC) or get on migrator-db-url for that SP.
# Callers pass scope/environment/module and gate their deploy on this job.

name: Database migrate (reusable)

on:
  workflow_call:
    inputs:
      scope:
        description: "saas | enterprise-<slug>"
        required: true
        type: string
      environment:
        description: "dev | prod"
        required: true
        type: string
      module:
        description: "core_platform | loandrift | mystoreguard | human_resource | all"
        required: false
        type: string
        default: all
      command:
        description: "deploy | validate | verify (defaults to deploy)"
        required: false
        type: string
        default: deploy

concurrency:
  # One in-flight migration per (repo, scope, environment) — a backend deploy and
  # a manual dispatch against the same DB queue instead of racing.
  group: tvs-sqlscript-${{ github.repository }}-${{ inputs.scope }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: 🚀 ${{ inputs.command }} → ${{ inputs.scope }}-${{ inputs.environment }} · ${{ inputs.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write   # Azure OIDC (read migrator-db-url from Key Vault)
      contents: read

    defaults:
      run:
        shell: bash

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TVS_SSL: Require
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # When called from another repo the `github` context points at the CALLER,
      # so a bare checkout would clone the backend, not this migrator. Pin the
      # tvs-sqlscript source explicitly. PACKAGES_TOKEN (org PAT, contents:read
      # on tvs-sqlscript) flows in via the caller's `secrets: inherit`.
      - uses: actions/checkout@v4
        with:
          repository: deladetech1/tvs-sqlscript
          ref: master
          token: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build Trovesuite.Database.sln -c Release --nologo

      - name: Resolve Azure target (SP + subscription + Key Vault)
        id: az
        run: |
          set -euo pipefail
          SCOPE="${{ inputs.scope }}"; ENVN="${{ inputs.environment }}"
          TENANT="${{ vars.TVS_TENANT_ID }}"
          if [[ "$SCOPE" == "saas" ]]; then
            CLIENT="${{ vars.TVS_AZURE_CLIENT_ID }}"
            case "$ENVN" in
              dev)  SUB="${{ vars.TVS_DEV_SUBSCRIPTION_ID }}";  KV="tvs-dev-kv" ;;
              prod) SUB="${{ vars.TVS_PROD_SUBSCRIPTION_ID }}"; KV="tvs-prod-kv" ;;
              *) echo "::error::unsupported saas environment '$ENVN'"; exit 1 ;;
            esac
          elif [[ "$SCOPE" == "enterprise-bgclt" ]]; then
            CLIENT="${{ vars.BGCLT_AZURE_CLIENT_ID }}"
            SUB="${{ vars.BGCLT_SUBSCRIPTION_ID }}"
            KV="bgclt-${ENVN}-kv"
          else
            echo "::error::unsupported scope '$SCOPE' — add its client-id / subscription / KV mapping to migrate.yml"; exit 1
          fi
          [ -n "$CLIENT" ] && [ -n "$SUB" ] && [ -n "$TENANT" ] \
            || { echo "::error::missing org variable for client/subscription/tenant (scope=$SCOPE env=$ENVN)"; exit 1; }
          {
            echo "client_id=$CLIENT"
            echo "tenant_id=$TENANT"
            echo "subscription_id=$SUB"
            echo "kv=$KV"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Azure target::scope=$SCOPE env=$ENVN KV=$KV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ steps.az.outputs.client_id }}
          tenant-id: ${{ steps.az.outputs.tenant_id }}
          subscription-id: ${{ steps.az.outputs.subscription_id }}

      - name: Read migrator-db-url from Key Vault and parse it
        id: db
        run: |
          set -euo pipefail
          DATABASE_URL="$(az keyvault secret show --vault-name '${{ steps.az.outputs.kv }}' --name migrator-db-url --query value -o tsv)"
          [ -n "$DATABASE_URL" ] || { echo "::error::migrator-db-url not found / empty in ${{ steps.az.outputs.kv }}"; exit 1; }
          echo "::add-mask::$DATABASE_URL"

          # libpq URL → fields: postgresql://user:password@host:port/dbname?sslmode=require
          proto_stripped="${DATABASE_URL#postgresql://}"
          proto_stripped="${proto_stripped#postgres://}"
          creds="${proto_stripped%%@*}"
          rest="${proto_stripped#*@}"
          DB_USER="${creds%%:*}"
          PGPASSWORD="${creds#*:}"
          hostport="${rest%%/*}"
          DB_HOST="${hostport%%:*}"
          DB_PORT="${hostport#*:}"
          [[ "$DB_PORT" == "$hostport" ]] && DB_PORT=5432
          dbpart="${rest#*/}"
          DB_NAME="${dbpart%%\?*}"

          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_HOST"
          {
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_USER=$DB_USER"
            echo "PGPASSWORD=$PGPASSWORD"
            echo "DB_NAME=$DB_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Map module → pick & extract enterprise slug
        id: map
        run: |
          set -euo pipefail
          case "${{ inputs.module }}" in
            core_platform)  PICK=1 ;;
            loandrift)      PICK=2 ;;
            mystoreguard)   PICK=3 ;;
            human_resource) PICK=4 ;;
            all)            PICK=0 ;;
            *) echo "::error::unknown module '${{ inputs.module }}'"; exit 1 ;;
          esac
          echo "pick=$PICK" >> "$GITHUB_OUTPUT"
          SCOPE="${{ inputs.scope }}"
          if [[ "$SCOPE" == enterprise-* ]]; then
            echo "slug=${SCOPE#enterprise-}" >> "$GITHUB_OUTPUT"
          else
            echo "slug=" >> "$GITHUB_OUTPUT"
          fi

      - name: 📍 Target summary
        run: |
          SLUG="${{ steps.map.outputs.slug }}"
          {
            echo "## 🎯 \`${{ inputs.command }}\` → \`${{ inputs.scope }}-${{ inputs.environment }}\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Command**     | \`${{ inputs.command }}\` |"
            echo "| **Key Vault**   | \`${{ steps.az.outputs.kv }}\` (migrator-db-url) |"
            echo "| **DB host**     | \`${{ steps.db.outputs.DB_HOST }}\` |"
            echo "| **DB name**     | \`${{ steps.db.outputs.DB_NAME }}\` |"
            echo "| **Module**      | \`${{ inputs.module }}\` |"
            echo "| **Enterprise**  | \`${SLUG:-none — scope=saas}\` |"
            echo "| **Called by**   | \`${{ github.repository }}\` @ \`${{ github.sha }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 ${{ inputs.command }}
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          DB_USER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
          # Empty for scope=saas; set for enterprise-<slug> so the Runner also
          # applies migrations/enterprise/<slug>/*.sql.
          TVS_ENTERPRISE: ${{ steps.map.outputs.slug }}
        run: |
          set -euo pipefail
          case "${{ inputs.command }}" in
            deploy|validate|verify) ;;
            *) echo "::error::command '${{ inputs.command }}' not allowed here (deploy|validate|verify). Use database-dispatch.yml for rollback."; exit 1 ;;
          esac
          echo "::group::Runner output (module pick ${{ steps.map.outputs.pick }}; 0=ALL)"
          printf '%s\n' "${{ steps.map.outputs.pick }}" \
            | dotnet run --no-build -c Release \
                --project src/Trovesuite.Database.Runner -- \
                "$DB_HOST" "$DB_PORT" "$DB_USER" "$PGPASSWORD" "$DB_NAME" "${{ inputs.command }}"
          echo "::endgroup::"
          echo "::notice title=✅ ${{ inputs.command }} succeeded::${{ inputs.scope }}-${{ inputs.environment }} — module=${{ inputs.module }}"
