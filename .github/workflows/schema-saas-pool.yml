# Auto-deploy EF Core migrations to saas-dev when changes merge to `dev` or to
# the `saas` branch. Deploys ALL modules (core_platform → loandrift →
# mystoreguard → zeloshr).
#
#   dev | saas push → GitHub Environment saas-dev (DATABASE_URL)
#
# THE BRANCH SAYS WHICH CLASS OF DATABASE A CHANGE IS FOR, not which tenant.
# Three branches, because there are three kinds of target and they roll out at
# different speeds:
#
#   saas        the pooled database — this workflow, automatic on dev and saas
#   silo        every tenant with its own database — schema-silos.yml
#   enterprise  every self-hosted customer — schema-enterprise.yml
#
# There is deliberately no branch per tenant. A branch per customer would be a
# dozen branches that each have to be kept level with the schema, and the one
# nobody rebased is the one that breaks. The class branches share
# migrations/shared/, so a table change is written once and reaches all three.
#
# Only the SaaS pool deploys automatically. Silos and enterprises are dispatched
# by hand: they are other people's databases, and a push is not consent to touch
# them. Application deploys never migrate a DB.

name: Schema · SaaS pool (auto on dev)

on:
  push:
    branches:
      - dev
      - saas
    paths:
      - "src/**"
      - "migrations/**"
      - "Directory.Build.props"
      - "Trovesuite.Database.sln"
      - ".github/workflows/schema-saas-pool.yml"

concurrency:
  group: tvs-sqlscript-deploy-saas-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 deploy → saas-dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: saas-dev

    defaults:
      run:
        shell: bash

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TVS_SSL: Require
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # So the Runner applies migrations/shared/ then migrations/saas/ — and not
      # the silo or enterprise trees, which this database is neither of.
      TVS_TARGET_CLASS: saas

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build Trovesuite.Database.sln -c Release --nologo

      - name: Parse DATABASE_URL into env vars
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::DATABASE_URL is not set on environment 'saas-dev'."
            exit 1
          fi
          echo "::add-mask::${DATABASE_URL}"

          proto_stripped="${DATABASE_URL#postgresql://}"
          proto_stripped="${proto_stripped#postgres://}"
          creds="${proto_stripped%%@*}"
          rest="${proto_stripped#*@}"
          DB_USER="${creds%%:*}"
          PGPASSWORD="${creds#*:}"
          hostport="${rest%%/*}"
          DB_HOST="${hostport%%:*}"
          DB_PORT="${hostport#*:}"
          [[ "$DB_PORT" == "$hostport" ]] && DB_PORT=5432
          dbpart="${rest#*/}"
          DB_NAME="${dbpart%%\?*}"

          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_HOST"

          {
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_USER=$DB_USER"
            echo "PGPASSWORD=$PGPASSWORD"
            echo "DB_NAME=$DB_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: 📍 Target summary
        run: |
          {
            echo "## 🚀 Auto deploy → \`saas-dev\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Modules** | all (incl. zeloshr / ZelosHR) |"
            echo "| **DB host** | \`${{ steps.db.outputs.DB_HOST }}\` |"
            echo "| **DB name** | \`${{ steps.db.outputs.DB_NAME }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 deploy all modules
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          DB_USER: ${{ steps.db.outputs.DB_USER }}
          PGPASSWORD: ${{ steps.db.outputs.PGPASSWORD }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
        run: |
          echo "::group::Runner output (module pick 0 = ALL)"
          printf '0\n' \
            | dotnet run --no-build -c Release \
                --project src/Trovesuite.Database.Runner -- \
                "$DB_HOST" "$DB_PORT" "$DB_USER" "$PGPASSWORD" "$DB_NAME" deploy
          echo "::endgroup::"
          echo "::notice title=✅ deploy succeeded::${{ github.ref_name }} → saas-dev"
